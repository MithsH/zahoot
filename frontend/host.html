<!DOCTYPE html>
<html>
<head>
    <title>Host Quiz</title>
    <link href="css/host.css" rel="stylesheet">
</head>
<body>
    <div class="host-layout">
        
        <div class="left-panel">
            <h3>Room Setup</h3>
            <input type="text" id="roomCode" placeholder="Room Code">
            <button onclick="connectAsHost()">Connect</button>
        </div>

        <div class="right-panel">
            <h3>Create Question</h3>
            <input type="text" id="qtext" placeholder="Question"><br>
            <input type="text" id="opt0" placeholder="Option 1"><br>
            <input type="text" id="opt1" placeholder="Option 2"><br>
            <input type="text" id="opt2" placeholder="Option 3"><br>
            <input type="text" id="opt3" placeholder="Option 4"><br>
            <input type="number" id="correctIndex" placeholder="Correct (0-3)"><br>
            <button onclick="sendStructuredQuestion()">Send</button>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
