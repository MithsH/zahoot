<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahoot! - Join Quiz</title>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <!-- FLOATING TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- PRE-JOIN SECTION -->
    <div id="joinSection" class="container">
        <h1>🚀 Zahoot!</h1>
        <p>Enter your details to join the live room</p>

        <input type="text" id="playerName" placeholder="Enter Your Name" autocomplete="off">
        <input type="text" id="roomCode" placeholder="Enter Room Code" autocomplete="off">
        <button class="join-btn" onclick="joinRoom()">Join Game</button>
    </div>

    <!-- MAIN GAME LAYOUT (SIDEBAR LEADERBOARD + CENTERED QUESTION) -->
    <div id="gameLayout" class="game-layout" style="display: none;">
        
        <!-- SIDEBAR PANEL: Score & Live Leaderboard -->
        <div class="sidebar-panel">
            
            <!-- Player Score Card -->
            <div class="player-score-card">
                <div class="score-badge">
                    <span class="rocket-icon">🚀</span>
                    <span id="playerScore" class="score-value">0</span>
                </div>
                <div class="player-info-meta">
                    <div id="displayName" class="player-name-display">Player</div>
                    <div class="player-status-tag">Score</div>
                </div>
            </div>

            <!-- Leaderboard Box -->
            <div class="leaderboard-box">
                <div class="leaderboard-title">
                    <span>🏆 Live Leaderboard</span>
                </div>
                <ul id="leaderboard" class="leaderboard-list">
                    <!-- Leaderboard items injected via JavaScript -->
                </ul>
            </div>
        </div>

        <!-- CENTER PANEL: Question & 2x2 Options Grid -->
        <div class="main-game-panel">
            
            <!-- Question Top Bar -->
            <div>
                <div class="room-status-bar">
                    <div>Room: <span id="displayRoomCode" class="room-code-tag">---</span></div>
                    <div id="connectionStatus" style="color: #00E676;">● Connected</div>
                </div>

                <div class="question-top-bar">
                    <span class="category-tag">QUIZ QUESTION</span>
                    <div id="timerBadge" class="timer-badge">
                        <span>⏱️</span>
                        <span id="timerSeconds">15</span>s
                    </div>
                </div>

                <!-- Question Text -->
                <div class="question-container">
                    <h2 id="questionText" class="question-title">Waiting for host to send a question...</h2>
                </div>

                <!-- Status Banner (Choice Locked / Result Reveal) -->
                <div id="statusBanner" class="answer-status-banner"></div>
            </div>

            <!-- 2x2 Options Grid Container -->
            <div id="options" class="options-grid">
                <!-- 4 Option cards rendered via JavaScript -->
            </div>
            
        </div>

    </div>

    <!-- WebSockets & STOMP Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
